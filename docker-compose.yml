services:
  aion-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AION_PROJECT_ROOT: /app
      AION_RUNTIME_MODE: simulation
      AION_ALLOW_HOST_MUTATION: "0"
      AION_DASHBOARD_HOST: 0.0.0.0
      AION_DASHBOARD_PORT: 8000
      AION_LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./.aion-state:/app/.aion-state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
