services:
  aion-dashboard:
    image: ghcr.io/${GITHUB_REPOSITORY:-warlyjr-cloud/aion-os}:latest
    pull_policy: always
    environment:
      AION_PROJECT_ROOT: /app
      AION_RUNTIME_MODE: simulation
      AION_ALLOW_HOST_MUTATION: "0"
      AION_DASHBOARD_HOST: 0.0.0.0
      AION_DASHBOARD_PORT: 8000
      AION_LOG_LEVEL: info
    volumes:
      - aion-state:/app/.aion-state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - aion-dashboard
    restart: unless-stopped

volumes:
  aion-state:
  caddy-data:
  caddy-config:
