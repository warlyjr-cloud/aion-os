[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aion-os"
version = "0.1.0"
description = "The largest decentralized data center in the world, created by AI and a single person. Bare-metal Rust Microkernel & DePIN."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BUSL-1.1" }
authors = [{ name = "AION contributors" }]
dependencies = [
  "pydantic>=2.11.7",
  "typer>=0.19.2",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "jinja2>=3.1.2",
  "httpx>=0.24.1",
  "anthropic>=0.30.0",
  "fusepy==3.0.1",
  "psutil==7.2.2",
  "astor>=0.8.1",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.165.0",
  "jsonschema==4.26.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
  "uv==0.12.1",
]

[project.scripts]
aionctl = "aionctl.cli:app"
aiond = "aiond.daemon:main"
aion-cli = "src.cli:main"
aion-dashboard = "src.dashboard.app:main"
aion-health = "scripts.health_check:main"
aion-smoke = "scripts.smoke_check:main"
aion-verify-readme = "scripts.verify_readme:main"
aion-verify-public = "scripts.verify_public_release:main"
aion-secret-scan = "scripts.secret_safety_check:main"
aion-verify-deployment = "scripts.verify_deployment:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src",
  "src/actions",
  "src/aionctl",
  "src/aiond",
  "src/audit",
  "src/capabilities",
  "src/dashboard",
  "src/evaluator",
  "src/evolution",
  "src/executor",
  "src/genome",
  "src/immune_memory",
  "src/intent",
  "src/model_council",
  "src/policy",
  "src/population",
  "src/proofs",
  "src/providers",
  "src/red_team",
  "src/tcb",
  "src/vek",
  "scripts",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
markers = [
  "integration: crosses multiple AION components",
  "security: validates a security invariant",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = [".venv", "proofs", "benchmarks/os_evobench/reports"]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.aion]
bootstrap_command = "python scripts/bootstrap.sh"
smoke_command = "python scripts/smoke_check.py"
health_command = "python scripts/health_check.py"
