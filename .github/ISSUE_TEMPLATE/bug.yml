name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, hidden tests, or exploit details. Use a private security advisory for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: AION version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Simulation
        - AION Lab VM
        - WSL/container
        - Other isolated environment
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include typed actions and redacted logs; never include secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I reproduced this without disabling audit, sandboxing, rollback, or emergency stop.
          required: true
        - label: I removed secrets and personal data.
          required: true
