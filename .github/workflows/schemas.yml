name: Schemas and protected files

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schemas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-input "uv==0.12.1"

      - name: Sync locked environment
        run: uv sync --extra dev --frozen

      - name: Validate schemas and governed manifests
        run: uv run --frozen python scripts/validate_schemas.py

      - name: Parse all static JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done < <(find schemas capabilities policies tools -type f -name '*.json' -print0)
          python -m json.tool flake.lock >/dev/null

  protected-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HUMAN_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'human-reviewed-protected-change') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Require maintainer label for protected changes
        shell: bash
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          protected="$(printf '%s\n' "$changed" | grep -E '^(docs/(SAFETY_CONSTITUTION|TCB_SPECIFICATION)\.md|src/tcb/|policies/|\.github/workflows/)' || true)"
          if [[ -n "$protected" && "$HUMAN_REVIEWED" != "true" ]]; then
            printf 'Protected files changed:\n%s\n' "$protected"
            printf 'A maintainer must review the change and add the human-reviewed-protected-change label.\n'
            exit 1
          fi
