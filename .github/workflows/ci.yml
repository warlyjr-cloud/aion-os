name: Python CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-input "uv==0.12.1"

      - name: Sync locked environment
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen pyright

      - name: Test
        env:
          AION_RUNTIME_MODE: simulation
          AION_ALLOW_HOST_MUTATION: "0"
        run: uv run --frozen python -m pytest

      - name: Verify README workflow
        env:
          AION_RUNTIME_MODE: simulation
          AION_ALLOW_HOST_MUTATION: "0"
        run: uv run --frozen python scripts/verify_readme.py

      - name: Verify public release workflow
        env:
          AION_RUNTIME_MODE: simulation
          AION_ALLOW_HOST_MUTATION: "0"
        run: uv run --frozen python scripts/verify_public_release.py

      - name: Verify deployment workflow
        env:
          AION_RUNTIME_MODE: simulation
          AION_ALLOW_HOST_MUTATION: "0"
        run: uv run --frozen python scripts/verify_deployment.py
