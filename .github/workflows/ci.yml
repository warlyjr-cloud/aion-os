name: Python CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_CACHE_DIR: .uv-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-input "uv==0.12.1"

      - name: Sync locked environment
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen pyright

      - name: Test
        env:
          AION_RUNTIME_MODE: simulation
          AION_ALLOW_HOST_MUTATION: "0"
        run: uv run --frozen python -m pytest
